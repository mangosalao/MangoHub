<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Streamer - Mango Hub</title>

<style>

body {
    font-family: "Segoe UI", sans-serif;
    background: #0f172a;
    color: white;
    padding: 30px;
}

h1 {
    margin-bottom: 20px;
    font-size: 28px;
}

h1 span {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.stats {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
    min-width: 200px;
}

.card-title {
    font-size: 13px;
    color: #94a3b8;
}

.card-value {
    font-size: 28px;
    font-weight: bold;
}

.pending { color: #facc15; }
.played { color: #22c55e; }
.current { color: #38bdf8; }

table {
    width: 100%;
    background: #1e293b;
    border-collapse: collapse;
    margin-top: 20px;
    border-radius: 10px;
    overflow: hidden;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #334155;
    text-align: left;
}

th {
    background: #172033;
}

button {
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover { opacity: .8; }

.slider-box {
    margin: 20px 0;
    padding: 15px;
    background: #1e293b;
    border-radius: 10px;
}

input[type="range"] {
    width: 300px;
}

.back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #94a3b8;
    text-decoration: none;
    font-size: 14px;
}

.back-link:hover {
    color: #fbbf24;
}

</style>

</head>
<body>

<a href="/dashboard" class="back-link">← Volver al Dashboard</a>

<h1>⚙️ <span>Mango Hub</span> - Panel Streamer</h1>

<div class="stats">

<div class="card">
<div class="card-title">Pendientes</div>
<div class="card-value pending" id="pending">0</div>
</div>

<div class="card">
<div class="card-title">Reproducidos</div>
<div class="card-value played" id="played">0</div>
</div>

<div class="card">
<div class="card-title">Total</div>
<div class="card-value" id="total">0</div>
</div>

<div class="card">
<div class="card-title">Reproduciendo</div>
<div class="card-value current" id="current">Nadie</div>
</div>

</div>

<!-- 🎚️ VOLUMEN -->
<div class="slider-box">
<h3>🔊 Volumen Global</h3>

<input
type="range"
min="0"
max="1"
step="0.01"
id="volumeSlider"
/>

<span id="volumeValue">1</span>
</div>

<table>

<thead>
<tr>
<th>ID</th>
<th>Usuario</th>
<th>Estado</th>
<th>Audio</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const slider = document.getElementById("volumeSlider");
const volumeValue = document.getElementById("volumeValue");

async function loadSettings() {
const res = await fetch("/api/voice/settings");
const data = await res.json();

slider.value = data.volume || 1;
volumeValue.textContent = data.volume || 1;
}

slider.addEventListener("input", async () => {

volumeValue.textContent = slider.value;

await fetch("/api/voice/set-volume", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
        volume: slider.value
    })
});

});

async function loadQueue() {

const res = await fetch("/api/streamer/queue");
const data = await res.json();

const table = document.getElementById("table");

table.innerHTML = "";

let pending = 0;
let played = 0;

data.forEach(a => {

if (a.status === "pending") pending++;
else played++;

const row = document.createElement("tr");

row.innerHTML = `
<td>${a.id}</td>
<td>${a.username}</td>
<td>${a.status}</td>
<td>
<audio controls src="/uploads/${a.filename}"></audio>
</td>
<td>
<button onclick="deleteAudio(${a.id})">❌</button>
</td>
`;

table.appendChild(row);

});

document.getElementById("pending").textContent = pending;
document.getElementById("played").textContent = played;
document.getElementById("total").textContent = data.length;

}

async function loadCurrent() {
const res = await fetch("/api/voice/current-audio");
const data = await res.json();

document.getElementById("current").textContent =
data ? data.username : "Nadie";
}

async function deleteAudio(id) {
await fetch("/api/voice/delete-audio/" + id, { method: "DELETE" });
loadQueue();
}

socket.on("queue-updated", loadQueue);
socket.on("current-audio", loadCurrent);
socket.on("settings-update", (data) => {

slider.value = data.volume;
volumeValue.textContent = data.volume;

});

loadQueue();
loadCurrent();
loadSettings();

setInterval(loadQueue, 5000);

</script>

</body>
</html>
